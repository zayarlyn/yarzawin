services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      # - '443:443'
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  web:
    image: ghcr.io/zayarlyn/yarzawin-web:latest
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_S3_PUB_BUCKET_URL: ${VITE_S3_PUB_BUCKET_URL}
    restart: unless-stopped

  api:
    image: ghcr.io/zayarlyn/yarzawin-api:latest
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    depends_on:
      yarzawin-postgres:
        condition: service_healthy
    restart: unless-stopped

  yarzawin-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    restart: unless-stopped

volumes:
  postgres_data:
